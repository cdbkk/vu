[workspace]
members = [
    "crates/vu-app",
    "crates/vu-core",
    "crates/vu-paths",
    "crates/vu-terminal",
    "crates/vu-ghostty",
    "crates/vu-cli",
    "crates/vu-test",
]
default-members = ["crates/vu-app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
# Internal crates
vu-core = { path = "crates/vu-core" }
vu-paths = { path = "crates/vu-paths" }
vu-terminal = { path = "crates/vu-terminal" }
vu-ghostty = { path = "crates/vu-ghostty" }

# UI — upstream GPUI
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }

# UI Components — upstream gpui-component, never local 3pp paths
# Pinned to a fork carrying ColorPickerState::set_open (upstream PR pending);
# revert these three to longbridge/main once it merges.
gpui-component = { git = "https://github.com/cdbkk/gpui-component.git", branch = "con-pin", package = "gpui-component" }
gpui-component-macros = { git = "https://github.com/cdbkk/gpui-component.git", branch = "con-pin", package = "gpui-component-macros" }
gpui-component-assets = { git = "https://github.com/cdbkk/gpui-component.git", branch = "con-pin", package = "gpui-component-assets" }


# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Text & Language
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
lsp-types = { version = "0.97.0", features = ["proposed"] }
unicode-width = "0.2"

# Utilities
anyhow = "1"
log = "0.4"
tracing = "0.1"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
smallvec = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[workspace.lints.clippy]
# Inherited by gpui-component crates
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
