# Build/run shortcuts for targets that can't use the default `[[bin]] con`.
#
# `CON` is a reserved DOS device name on Windows, so the Windows build
# ships as `vu-app.exe` via the `bin-con-app` feature. These aliases
# wrap the longer `--no-default-features --features` incantation so day-
# to-day commands stay ergonomic:
#
#   cargo wcheck -p vu        # same as `cargo check -p vu` on Windows
#   cargo wbuild -p vu --release
#   cargo wrun   -p vu
#
# On macOS and Linux keep using the normal `cargo build` / `cargo run` —
# the default feature set targets those platforms.

[alias]
wcheck = "check --no-default-features --features vu/bin-vu-app"
wbuild = "build --no-default-features --features vu/bin-vu-app"
wrun   = "run   --no-default-features --features vu/bin-vu-app --bin vu-app"
wtest  = "test  --no-default-features --features vu/bin-vu-app"
