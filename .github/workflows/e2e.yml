name: e2e

# End-to-end tests using vu-test against a real vu process.
# Runs on macOS only — vu requires a display for the GPUI window.
# vu-test launches vu automatically, resets state between files,
# and kills the process on exit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "crates/vu-test/**"
      - "crates/vu-app/**"
      - "crates/vu-core/**"
      - "crates/vu-cli/**"
      - "crates/vu-ghostty/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "crates/vu-test/**"
      - "crates/vu-app/**"
      - "crates/vu-core/**"
      - "crates/vu-cli/**"
      - "crates/vu-ghostty/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Suppress vu's own log output during tests
  RUST_LOG: error

jobs:
  e2e:
    name: e2e (macos-15)
    # Keep e2e on the same stable macOS generation as release builds. The
    # macOS 26 preview image behind macos-latest currently breaks the Zig 0.15.2
    # libghostty build before Rust code is compiled.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig 0.15.2
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION="0.15.2"
          ZIG_ARCH="aarch64"
          # Use x86_64 on Intel runners
          if [[ "$(uname -m)" == "x86_64" ]]; then
            ZIG_ARCH="x86_64"
          fi
          ZIG_DIR="zig-${ZIG_ARCH}-macos-${ZIG_VERSION}"
          ZIG_TARBALL="${ZIG_DIR}.tar.xz"
          for base_url in \
            "https://zigmirror.hryx.net/zig" \
            "https://zig.linus.dev/zig" \
            "https://ziglang.org/download/${ZIG_VERSION}"; do
            if curl --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 120 \
              -sSfL "${base_url}/${ZIG_TARBALL}" \
              -o "/tmp/${ZIG_TARBALL}"; then
              break
            fi
          done
          test -s "/tmp/${ZIG_TARBALL}"
          mkdir -p "$HOME/.local"
          tar -xJf "/tmp/${ZIG_TARBALL}" -C "$HOME/.local"
          echo "$HOME/.local/${ZIG_DIR}" >> "$GITHUB_PATH"
          "$HOME/.local/${ZIG_DIR}/zig" version

      - name: Build vu, vu-cli, vu-test
        run: cargo build -p vu -p vu-cli -p vu-test

      - name: Run vu-test unit tests (parser)
        run: cargo test -p vu-test

      - name: Run E2E tests
        run: |
          ./target/debug/vu-test \
            --startup-timeout 30 \
            crates/vu-test/testdata/
        env:
          # Write vu logs to a file so they don't pollute test output.
          # Uploaded as an artifact on failure for debugging.
          VU_LOG_FILE: /tmp/vu-e2e.log

      - name: Upload vu log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vu-e2e-log
          path: /tmp/vu-e2e.log
          retention-days: 7
